name: Build and Deploy ModsBazaar Frontend

on:
  #push:
  #  branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # ModsBazaar Frontend Environment Variables
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
  NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
  NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME || 'ModsBazaar' }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
  NEXT_PUBLIC_APP_VERSION: ${{ secrets.NEXT_PUBLIC_APP_VERSION || '1.0.0' }}
  NEXT_PUBLIC_ENABLE_ANALYTICS: ${{ secrets.NEXT_PUBLIC_ENABLE_ANALYTICS || 'true' }}
  NEXT_PUBLIC_ENABLE_PWA: ${{ secrets.NEXT_PUBLIC_ENABLE_PWA || 'true' }}
  NEXT_PUBLIC_ENABLE_MAINTENANCE: ${{ secrets.NEXT_PUBLIC_ENABLE_MAINTENANCE || 'false' }}
  NEXT_PUBLIC_MAX_FILE_SIZE: ${{ secrets.NEXT_PUBLIC_MAX_FILE_SIZE || '50MB' }}
  NEXT_PUBLIC_ALLOWED_FILE_TYPES: ${{ secrets.NEXT_PUBLIC_ALLOWED_FILE_TYPES || '.zip,.rar,.7z' }}
  NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
  NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
  NEXT_PUBLIC_DISCORD_INVITE_URL: ${{ secrets.NEXT_PUBLIC_DISCORD_INVITE_URL }}
  NEXT_PUBLIC_DEBUG_MODE: ${{ secrets.NEXT_PUBLIC_DEBUG_MODE || 'false' }}
  NODE_ENV: production
  PORT: 3000

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build Next.js application
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
        NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME || 'ModsBazaar' }}
        NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        NEXT_PUBLIC_APP_VERSION: ${{ secrets.NEXT_PUBLIC_APP_VERSION || '1.0.0' }}
        NEXT_PUBLIC_ENABLE_ANALYTICS: ${{ secrets.NEXT_PUBLIC_ENABLE_ANALYTICS || 'true' }}
        NEXT_PUBLIC_ENABLE_PWA: ${{ secrets.NEXT_PUBLIC_ENABLE_PWA || 'true' }}
        NEXT_PUBLIC_ENABLE_MAINTENANCE: ${{ secrets.NEXT_PUBLIC_ENABLE_MAINTENANCE || 'false' }}
        NEXT_PUBLIC_MAX_FILE_SIZE: ${{ secrets.NEXT_PUBLIC_MAX_FILE_SIZE || '50MB' }}
        NEXT_PUBLIC_ALLOWED_FILE_TYPES: ${{ secrets.NEXT_PUBLIC_ALLOWED_FILE_TYPES || '.zip,.rar,.7z' }}
        NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
        NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        NEXT_PUBLIC_DISCORD_INVITE_URL: ${{ secrets.NEXT_PUBLIC_DISCORD_INVITE_URL }}
        NEXT_PUBLIC_DEBUG_MODE: ${{ secrets.NEXT_PUBLIC_DEBUG_MODE || 'false' }}

    - name: Convert repository name to lowercase
      run: |
        echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_API_KEY=${{ secrets.NEXT_PUBLIC_API_KEY }}
          NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME || 'ModsBazaar' }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_VERSION=${{ secrets.NEXT_PUBLIC_APP_VERSION || '1.0.0' }}
          NEXT_PUBLIC_ENABLE_ANALYTICS=${{ secrets.NEXT_PUBLIC_ENABLE_ANALYTICS || 'true' }}
          NEXT_PUBLIC_ENABLE_PWA=${{ secrets.NEXT_PUBLIC_ENABLE_PWA || 'true' }}
          NEXT_PUBLIC_ENABLE_MAINTENANCE=${{ secrets.NEXT_PUBLIC_ENABLE_MAINTENANCE || 'false' }}
          NEXT_PUBLIC_MAX_FILE_SIZE=${{ secrets.NEXT_PUBLIC_MAX_FILE_SIZE || '50MB' }}
          NEXT_PUBLIC_ALLOWED_FILE_TYPES=${{ secrets.NEXT_PUBLIC_ALLOWED_FILE_TYPES || '.zip,.rar,.7z' }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_DISCORD_INVITE_URL=${{ secrets.NEXT_PUBLIC_DISCORD_INVITE_URL }}
          NEXT_PUBLIC_DEBUG_MODE=${{ secrets.NEXT_PUBLIC_DEBUG_MODE || 'false' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Deploy ModsBazaar Frontend to Production Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        port: ${{ secrets.PROD_PORT }}
        script: |
          set -e
          echo "🚀 Starting deployment of ModsBazaar Frontend..."
          DEPLOY_DIR="$HOME/mods-bazaar-frontend"
          mkdir -p $DEPLOY_DIR
          cd $DEPLOY_DIR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          cat > .env.production << 'ENV_EOF'
          NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
          NEXT_PUBLIC_API_KEY="${{ secrets.NEXT_PUBLIC_API_KEY }}"
          NEXT_PUBLIC_APP_NAME="${{ secrets.NEXT_PUBLIC_APP_NAME || 'ModsBazaar' }}"
          NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"
          NEXT_PUBLIC_APP_VERSION="${{ secrets.NEXT_PUBLIC_APP_VERSION || '1.0.0' }}"
          NEXT_PUBLIC_ENABLE_ANALYTICS="${{ secrets.NEXT_PUBLIC_ENABLE_ANALYTICS || 'true' }}"
          NEXT_PUBLIC_ENABLE_PWA="${{ secrets.NEXT_PUBLIC_ENABLE_PWA || 'true' }}"
          NEXT_PUBLIC_ENABLE_MAINTENANCE="${{ secrets.NEXT_PUBLIC_ENABLE_MAINTENANCE || 'false' }}"
          NEXT_PUBLIC_MAX_FILE_SIZE="${{ secrets.NEXT_PUBLIC_MAX_FILE_SIZE || '50MB' }}"
          NEXT_PUBLIC_ALLOWED_FILE_TYPES="${{ secrets.NEXT_PUBLIC_ALLOWED_FILE_TYPES || '.zip,.rar,.7z' }}"
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}"
          NEXT_PUBLIC_SENTRY_DSN="${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}"
          NEXT_PUBLIC_DISCORD_INVITE_URL="${{ secrets.NEXT_PUBLIC_DISCORD_INVITE_URL }}"
          NEXT_PUBLIC_DEBUG_MODE="${{ secrets.NEXT_PUBLIC_DEBUG_MODE || 'false' }}"
          NODE_ENV=production
          PORT=3000
          ENV_EOF
          cat > docker-compose.yml << 'COMPOSE_EOF'
          services:
            mods-bazaar-frontend:
              image: ghcr.io/isekhon/modsbazaar-api:latest
              container_name: mods-bazaar-frontend
              restart: unless-stopped
              ports:
                - "3000:3000" # Frontend Port
              environment:
                - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
                - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY}
                - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
                - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
                - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION}
                - NEXT_PUBLIC_ENABLE_ANALYTICS=${NEXT_PUBLIC_ENABLE_ANALYTICS}
                - NEXT_PUBLIC_ENABLE_PWA=${NEXT_PUBLIC_ENABLE_PWA}
                - NEXT_PUBLIC_ENABLE_MAINTENANCE=${NEXT_PUBLIC_ENABLE_MAINTENANCE}
                - NEXT_PUBLIC_MAX_FILE_SIZE=${NEXT_PUBLIC_MAX_FILE_SIZE}
                - NEXT_PUBLIC_ALLOWED_FILE_TYPES=${NEXT_PUBLIC_ALLOWED_FILE_TYPES}
                - NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID}
                - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
                - NEXT_PUBLIC_DISCORD_INVITE_URL=${NEXT_PUBLIC_DISCORD_INVITE_URL}
                - NEXT_PUBLIC_DEBUG_MODE=${NEXT_PUBLIC_DEBUG_MODE}
                - NODE_ENV=production
                - PORT=3000
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
                timeout: 10s
                interval: 30s
                retries: 3
                start_period: 40s
          COMPOSE_EOF
          echo "📦 Pulling latest images..."
          docker-compose --env-file .env.production pull
          echo "🛑 Stopping existing containers..."
          docker-compose --env-file .env.production down || true
          echo "🎯 Starting services..."
          docker-compose --env-file .env.production up -d
          echo "⏳ Waiting for application to be healthy..."
          for i in {1..30}; do
            if docker-compose --env-file .env.production ps | grep -q "healthy"; then
              echo "✅ Application is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Application failed to become healthy within 5 minutes"
              docker-compose --env-file .env.production logs mods-bazaar-frontend
              exit 1
            fi
            echo "Attempt $i/30: Waiting for health check..."
            sleep 10
          done
          echo "📊 Final deployment status:"
          docker-compose --env-file .env.production ps
          echo "🧹 Cleaning up old images..."
          docker image prune -f
          echo "🎉 Deployment completed successfully!"
          echo "🌐 ModsBazaar Frontend available at: http://$(hostname -I | awk '{print $1}'):3000"
